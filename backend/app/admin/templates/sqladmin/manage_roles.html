{% extends "sqladmin/layout.html" %}

{% block content %}
<div class="container-xl">

    <div class="page-header d-print-none mb-4">
        <h2 class="page-title">
            Manage Roles
        </h2>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">
                {{ membership.user.first_name }}
            </h3>&nbsp;
            <div class="text-muted">
                {{ membership.church.name }}
            </div>
        </div>

        <form method="post">

            <div class="card-body">

                {% for role in roles %}
                <div class="form-check mb-2">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="roles"
                        value="{{ role.id }}"
                        id="role_{{ role.id }}"

                        {% if role in membership.roles %}
                            checked
                        {% endif %}
                    >

                    <label
                        class="form-check-label"
                        for="role_{{ role.id }}"
                    >
                        <strong>{{ role.name }}</strong>

                        {% if role.description %}
                        <div class="text-muted">
                            {{ role.description }}
                        </div>
                        {% endif %}
                    </label>

                </div>
                {% endfor %}

            </div>

            <div class="card-footer">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Roles
                </button>

                <a
                    href="javascript:history.back()"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>
{% endblock %}
